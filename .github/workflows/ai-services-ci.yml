name: AI Services CI

on:
  push:
    paths:
      - "ai-services/**"
  pull_request:
    paths:
      - "ai-services/**"

jobs:
  ai-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - skills-trainer
          - assessment-engine
          - content-engine
          - digital-twin
    defaults:
      run:
        working-directory: ai-services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
